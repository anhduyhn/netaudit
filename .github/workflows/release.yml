name: release

# Build netauditor.exe and attach it to a GitHub Release whenever a
# version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: python -m pip install . pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build exe
        run: pyinstaller --onefile --console --clean --noconfirm --name netauditor packaging/entry.py

      - name: Smoke-test exe
        run: dist\netauditor.exe --version

      - name: Create release and attach exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }} dist/netauditor.exe
          --title "netauditor ${{ github.ref_name }}"
          --generate-notes
